<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFF8F9" />
    <meta
      name="description"
      content="InspoVault is a personal, local-first visual library for saving the websites, screenshots, notes, and details that inspire your next build."
    />
    <meta property="og:title" content="InspoVault — Save the spark." />
    <meta
      property="og:description"
      content="A personal visual library for website inspiration, screenshots, notes, and the path back to the source."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>InspoVault — Save the spark. Find it when you need it.</title>
    <script>
      (() => {
        document.documentElement.dataset.theme = 'light';
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = '#FFF8F9';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
